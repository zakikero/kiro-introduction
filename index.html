<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kiro's Haunted Flight</title>
  <style>
    :root {
      color-scheme: dark;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      background: #120b24;
      color: #e8d8ff;
      font-family: system-ui, "Segoe UI", sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 16px;
      padding: 16px;
      box-sizing: border-box;
    }

    h1 {
      margin: 0;
      font-size: 1.6rem;
      font-weight: 600;
      text-align: center;
      /* Soft illustrated Halloween feel: moonlit purple with a warm glow. */
      color: #f6e9ff;
      text-shadow: 0 0 12px rgba(255, 150, 60, 0.35);
    }

    /* The canvas holds the fixed 960x640 logical playfield. A later task
         letterboxes it to the viewport; here it simply scales down to fit. */
    #game-canvas {
      max-width: 100%;
      max-height: 70vh;
      aspect-ratio: 960 / 640;
      background: #1b1033;
      border: 1px solid #3a2a5e;
      border-radius: 8px;
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.45);
    }

    .controls {
      max-width: 640px;
      text-align: center;
      font-size: 0.9rem;
      line-height: 1.5;
      color: #c9b8e6;
    }

    .controls strong {
      color: #ffb347;
    }

    /* On-screen Flight_Power button (Req 1.7). Soft illustrated Halloween
       style; its enabled/disabled state surfaces Hover readiness at a glance:
       bright + glowing when a power-providing spirit is equipped and ready,
       dimmed when unavailable or on cooldown. */
    .action-bar {
      display: flex;
      justify-content: center;
    }

    .flight-power-button {
      font: 600 1rem system-ui, "Segoe UI", sans-serif;
      color: #2a1636;
      background: linear-gradient(180deg, #ffd27a, #ffb347);
      border: 1px solid #c77d1f;
      border-radius: 999px;
      padding: 10px 22px;
      cursor: pointer;
      box-shadow: 0 0 16px rgba(255, 150, 60, 0.4);
      transition:
        opacity 120ms ease,
        box-shadow 120ms ease;
    }

    .flight-power-button:hover:not(:disabled) {
      box-shadow: 0 0 22px rgba(255, 150, 60, 0.6);
    }

    .flight-power-button:disabled {
      cursor: default;
      opacity: 0.4;
      box-shadow: none;
    }

    /* Accessibility settings (Req 12.6, 12.7, 12.8): audio mute and
       reduced-motion toggles, keyboard-operable with a clearly visible focus
       ring so keyboard users can always see what is focused. */
    .settings {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 20px;
      justify-content: center;
      align-items: center;
      max-width: 640px;
      font-size: 0.9rem;
      color: #c9b8e6;
    }

    .settings fieldset {
      border: 1px solid #3a2a5e;
      border-radius: 8px;
      padding: 10px 16px;
      margin: 0;
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .settings legend {
      padding: 0 6px;
      color: #ffb347;
      font-weight: 600;
    }

    .settings label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .settings input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #ffb347;
      cursor: pointer;
    }

    /* A strong, consistent focus ring for EVERY interactive control so menus
       are comfortably keyboard-operable with visible focus (Req 12.6). */
    .flight-power-button:focus-visible,
    .settings label:focus-within,
    .settings input:focus-visible,
    button:focus-visible {
      outline: 3px solid #9ad0ff;
      outline-offset: 2px;
      border-radius: 6px;
    }

    /* Respect the OS-level reduced-motion setting too: tone down transitions
       so the preference is honored even before the in-game toggle is touched
       (Req 12.8). The in-game toggle additionally gates canvas effects. */
    @media (prefers-reduced-motion: reduce) {
      .flight-power-button {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <h1>Kiro's Haunted Flight</h1>

  <canvas id="game-canvas" width="960" height="640" aria-label="Game playfield"></canvas>

  <div class="action-bar">
    <button id="flight-power-button" type="button" class="flight-power-button"
      aria-label="Activate your spirit's flight power" disabled>
      Flight Power (E)
    </button>
  </div>

  <section class="controls" aria-label="Controls">
    <p>
      <strong>Space</strong> or <strong>click</strong> the playfield to flap ·
      <strong>E</strong> or the on-screen button for your spirit's flight power ·
      <strong>P</strong> to pause ·
      <strong>Q</strong> while paused to end the run
    </p>
  </section>

  <section class="settings" aria-label="Accessibility settings">
    <fieldset>
      <legend>Settings</legend>
      <label>
        <input id="mute-toggle" type="checkbox" />
        <span>Mute audio</span>
      </label>
      <label>
        <input id="reduced-motion-toggle" type="checkbox" />
        <span>Reduced motion</span>
      </label>
    </fieldset>
  </section>

  <script type="module" src="./src/main.js"></script>
</body>

</html>
